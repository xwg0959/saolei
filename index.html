<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Win11 Fluent Minesweeper</title>
<style>
*{box-sizing:border-box;user-select:none}
body{
    margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:"Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#dbeafe,#f5f5f5);
}
.window{
    width:min(95vw,900px);
    padding:24px;
    border-radius:24px;
    background:rgba(255,255,255,.65);
    backdrop-filter:blur(20px);
    box-shadow:0 20px 50px #0003;
}
h1{text-align:center}
.panel{
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
    margin-bottom:15px;
}
input,button{
    border:0;border-radius:12px;padding:10px 14px;
}
button{
    background:#0078d4;color:white;cursor:pointer;
}
#board{
    display:grid;gap:3px;justify-content:center;
}
.cell{
    width:34px;height:34px;
    border-radius:8px;
    background:#b8c7d9;
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;font-size:18px;
    cursor:pointer;
}
.cell:hover{background:#9db4cf}
.open{background:#eee;cursor:default}
.flag{background:#ffd54f}
.mine{background:#ef5350}
.n1{color:#1565c0}.n2{color:#2e7d32}.n3{color:#c62828}
#info{text-align:center;font-size:18px;margin:10px}
#msg{text-align:center;font-size:22px;margin-top:10px}
</style>
</head>
<body>
<div class="window">
<h1>💣 Win11 扫雷</h1>

<div class="panel">
行 <input id="r" value="12" type="number">
列 <input id="c" value="12" type="number">
雷 <input id="m" value="25" type="number">
<button onclick="apply()">应用</button>
<button onclick="restart()">重新开始</button>
</div>

<div id="info">雷: <span id="mc"></span>　时间: <span id="time">0</span></div>
<div id="board"></div>
<div id="msg"></div>
</div>

<script>
let rows=12,cols=12,mines=25;
let board=[],opened=0,flags=0,time=0;
let timer=null,started=false,over=false,generated=false;

function apply(){
 rows=+r.value; cols=+c.value; mines=+m.value;
 if(mines>=rows*cols-9){alert("雷太多");return}
 restart();
}

function restart(){
 clearInterval(timer);
 board=[];opened=0;flags=0;time=0;
 started=false;over=false;generated=false;
 timeEl().innerText=0;
 mc.innerText=mines;
 msg.innerText="";
 create();
}

function create(){
 boardDiv.innerHTML="";
 boardDiv.style.gridTemplateColumns=`repeat(${cols},34px)`;
 for(let y=0;y<rows;y++){
  board[y]=[];
  for(let x=0;x<cols;x++)
   board[y][x]={mine:false,num:0,open:false,flag:false};
 }
 for(let y=0;y<rows;y++)
  for(let x=0;x<cols;x++){
   let d=document.createElement("div");
   d.className="cell";
   d.onclick=()=>open(y,x);
   d.oncontextmenu=e=>{e.preventDefault();flag(y,x)};
   boardDiv.appendChild(d);
  }
}

function generate(sy,sx){
 let a=[];
 for(let y=0;y<rows;y++)
  for(let x=0;x<cols;x++)
   if(Math.abs(y-sy)>1||Math.abs(x-sx)>1)a.push([y,x]);

 a.sort(()=>Math.random()-.5);
 for(let i=0;i<mines;i++)board[a[i][0]][a[i][1]].mine=true;

 for(let y=0;y<rows;y++)
  for(let x=0;x<cols;x++)
   board[y][x].num=count(y,x);

 generated=true;
}

function count(y,x){
 let n=0;
 for(let a=-1;a<=1;a++)
  for(let b=-1;b<=1;b++){
   let Y=y+a,X=x+b;
   if(board[Y]?.[X]?.mine)n++;
  }
 return n;
}

function open(y,x){
 if(over)return;
 if(!generated)generate(y,x);

 if(!started){
  started=true;
  timer=setInterval(()=>{
   time++;timeEl().innerText=time;
  },1000);
 }

 let c=board[y][x];
 if(c.flag||c.open)return;

 if(c.mine){
  c.open=true;
  showMines();
  over=true;
  clearInterval(timer);
  msg.innerText="💥 游戏失败";
  return;
 }

 flood(y,x);
 draw();
 win();
}

function flood(y,x){
 if(y<0||x<0||y>=rows||x>=cols)return;
 let c=board[y][x];
 if(c.open||c.flag)return;
 c.open=true;opened++;
 if(c.num==0)
  for(let a=-1;a<=1;a++)
   for(let b=-1;b<=1;b++)
    flood(y+a,x+b);
}

function flag(y,x){
 if(over)return;
 let c=board[y][x];
 if(c.open)return;
 c.flag=!c.flag;
 flags+=c.flag?1:-1;
 mc.innerText=mines-flags;
 draw();
}

function draw(){
 [...boardDiv.children].forEach((d,i)=>{
  let y=Math.floor(i/cols),x=i%cols,c=board[y][x];
  d.className="cell";d.innerHTML="";
  if(c.open){
   d.classList.add("open");
   if(c.mine){d.innerHTML="💣";d.classList.add("mine")}
   else if(c.num){d.innerHTML=c.num;d.classList.add("n"+c.num)}
  }else if(c.flag){
   d.innerHTML="🚩";d.classList.add("flag");
  }
 });
}

function showMines(){
 for(let y of board)
  for(let c of y)
   if(c.mine)c.open=true;
 draw();
}

function win(){
 if(opened==rows*cols-mines){
  over=true;
  clearInterval(timer);
  msg.innerText="🎉 胜利";
 }
}

function timeEl(){return document.getElementById("time")}
let boardDiv=document.getElementById("board");
let mc=document.getElementById("mc");
let msg=document.getElementById("msg");
restart();
</script>
</body>
</html>
