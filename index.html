<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>扫雷 Minesweeper</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#202020;
    font-family:"Microsoft YaHei";
    color:white;
}

.container{
    background:#303030;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 30px #000;
    text-align:center;
}

h1{
    margin-top:0;
}

.info{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    font-size:20px;
}

button{
    padding:8px 20px;
    border:none;
    border-radius:8px;
    background:#0078d4;
    color:white;
    cursor:pointer;
    font-size:16px;
}

#board{
    display:grid;
    gap:2px;
    margin-top:15px;
}

.cell{

    width:35px;
    height:35px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#666;

    border-radius:4px;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;
}


.cell:hover{
    background:#888;
}


.open{

    background:#ddd;
    cursor:default;

}


.flag{

    background:#ffc107;

}


.mine{

    background:#e74c3c;

}


.n1{color:#0066ff}
.n2{color:#008000}
.n3{color:#ff0000}
.n4{color:#800080}
.n5{color:#800000}


#message{

    margin-top:15px;
    font-size:22px;

}

</style>

</head>


<body>


<div class="container">

<h1>💣 扫雷</h1>


<div class="info">

<span>
雷:
<b id="mineCount"></b>
</span>


<span>
时间:
<b id="time">0</b>
</span>

</div>


<button onclick="restart()">
重新开始
</button>


<div id="board"></div>


<div id="message"></div>


</div>



<script>


const rows=12;
const cols=12;
const mines=25;


let board=[];

let opened=0;
let flags=0;

let timer=0;
let timerId=null;

let started=false;
let gameOver=false;

let generated=false;



const boardDiv=document.getElementById("board");





function restart(){


    board=[];

    opened=0;
    flags=0;

    timer=0;

    started=false;
    gameOver=false;

    generated=false;


    clearInterval(timerId);


    document.getElementById("time").innerText=0;

    document.getElementById("mineCount").innerText=mines;

    document.getElementById("message").innerText="";


    createBoard();

}




function createBoard(){


    boardDiv.innerHTML="";


    boardDiv.style.gridTemplateColumns=
        `repeat(${cols},35px)`;



    for(let r=0;r<rows;r++){

        board[r]=[];

        for(let c=0;c<cols;c++){


            board[r][c]={

                mine:false,

                num:0,

                open:false,

                flag:false

            };


        }

    }



    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){


            let div=document.createElement("div");


            div.className="cell";


            div.dataset.r=r;
            div.dataset.c=c;



            div.onclick=function(){

                openCell(r,c);

            };


            div.oncontextmenu=function(e){

                e.preventDefault();

                flagCell(r,c);

            };


            boardDiv.appendChild(div);


        }

    }


}





// 第一次点击生成雷

function generateMines(sr,sc){


    let list=[];



    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){



            if(
                Math.abs(r-sr)<=1 &&
                Math.abs(c-sc)<=1
            ){

                continue;

            }


            list.push([r,c]);

        }

    }



    list.sort(()=>Math.random()-0.5);



    for(let i=0;i<mines;i++){


        let [r,c]=list[i];


        board[r][c].mine=true;


    }



    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){



            if(!board[r][c].mine){


                board[r][c].num=countMines(r,c);


            }


        }

    }


    generated=true;


}






function countMines(r,c){


    let n=0;


    for(let y=-1;y<=1;y++){

        for(let x=-1;x<=1;x++){


            let nr=r+y;
            let nc=c+x;



            if(

                nr>=0 &&
                nr<rows &&
                nc>=0 &&
                nc<cols &&
                board[nr][nc].mine

            ){

                n++;

            }


        }

    }


    return n;


}







function openCell(r,c){


    if(gameOver)
        return;



    if(!generated){

        generateMines(r,c);

    }



    if(!started){


        started=true;


        timerId=setInterval(()=>{


            timer++;


            document.getElementById("time").innerText=timer;


        },1000);


    }



    let cell=board[r][c];



    if(cell.flag||cell.open)
        return;





    if(cell.mine){


        cell.open=true;


        showMines();


        gameOver=true;


        clearInterval(timerId);


        document.getElementById("message").innerText=
            "💥 游戏失败";


        return;


    }




    flood(r,c);


    draw();


    checkWin();


}







// 连锁展开

function flood(r,c){


    if(

        r<0 ||
        c<0 ||
        r>=rows ||
        c>=cols

    )
        return;



    let cell=board[r][c];



    if(cell.open||cell.flag)
        return;



    cell.open=true;


    opened++;





    if(cell.num===0){


        for(let y=-1;y<=1;y++){


            for(let x=-1;x<=1;x++){


                flood(
                    r+y,
                    c+x
                );


            }


        }


    }


}








function flagCell(r,c){


    if(gameOver)
        return;


    let cell=board[r][c];


    if(cell.open)
        return;



    cell.flag=!cell.flag;


    flags += cell.flag?1:-1;



    document.getElementById("mineCount").innerText=
        mines-flags;



    draw();


}









function draw(){


    let cells=document.querySelectorAll(".cell");



    cells.forEach(div=>{


        let r=div.dataset.r;

        let c=div.dataset.c;



        let cell=board[r][c];



        div.className="cell";



        if(cell.open){


            div.classList.add("open");



            if(cell.mine){


                div.innerHTML="💣";

                div.classList.add("mine");


            }
            else if(cell.num){


                div.innerHTML=cell.num;

                div.classList.add("n"+cell.num);


            }
            else{


                div.innerHTML="";


            }


        }
        else if(cell.flag){


            div.innerHTML="🚩";

            div.classList.add("flag");


        }
        else{


            div.innerHTML="";


        }



    });


}







function showMines(){


    for(let r=0;r<rows;r++){


        for(let c=0;c<cols;c++){


            if(board[r][c].mine){


                board[r][c].open=true;


            }


        }


    }


    draw();


}







function checkWin(){


    if(opened===rows*cols-mines){


        gameOver=true;


        clearInterval(timerId);



        document.getElementById("message").innerText=
            "🎉 胜利!";


    }


}





restart();


</script>


</body>
</html>
